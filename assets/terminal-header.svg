<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Pralav Singh terminal banner</title>
  <desc id="desc">A dark terminal window introducing Pralav Singh as a full-stack developer and product builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12" />
      <stop offset="0.5" stop-color="#0D1117" />
      <stop offset="1" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0" />
      <stop offset="0.25" stop-color="#7C3AED" />
      <stop offset="0.72" stop-color="#00E5FF" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(205 180) rotate(18) scale(340 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.22" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1020 195) rotate(160) scale(320 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8B949E" stroke-opacity="0.045" />
    </pattern>
  </defs>

  <rect width="1200" height="350" rx="18" fill="url(#bg)" />
  <rect width="1200" height="350" rx="18" fill="url(#glowA)" />
  <rect width="1200" height="350" rx="18" fill="url(#glowB)" />
  <rect width="1200" height="350" rx="18" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="348" rx="17" fill="none" stroke="#30363D" />

  <path d="M18 61H1182" stroke="#30363D" />
  <circle cx="34" cy="31" r="6" fill="#FF5F57" />
  <circle cx="55" cy="31" r="6" fill="#FEBC2E" />
  <circle cx="76" cy="31" r="6" fill="#28C840" />
  <text x="600" y="37" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">pralav@github — profile</text>

  <text x="70" y="114" fill="#7EE787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">pralav@github</text>
  <text x="224" y="114" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">:</text>
  <text x="238" y="114" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">~</text>
  <text x="255" y="114" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">$ whoami</text>

  <text x="70" y="179" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="43" font-weight="700" letter-spacing="0.8">PRALAV SINGH</text>
  <rect x="70" y="198" width="545" height="3" rx="1.5" fill="url(#line)" filter="url(#softGlow)" />

  <text x="70" y="244" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">full-stack developer  ·  product builder  ·  visual storyteller</text>
  <text x="70" y="294" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">status:</text>
  <text x="143" y="294" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">● shipping ideas into products</text>

  <rect x="1117" y="280" width="3" height="22" fill="#00E5FF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
  </rect>
</svg>
