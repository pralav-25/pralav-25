<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Pralav contribution crop</title>
  <desc id="desc">The word PRALAV drawn with orange and red contribution-style pixels.</desc>
  <defs>
    <pattern id="idlePixels" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" rx="2" fill="#2C1712" />
    </pattern>
    <pattern id="livePixels" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="13" height="13" rx="2" fill="#FF4B2E" />
    </pattern>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2B20" />
      <stop offset="0.42" stop-color="#C63D25" />
      <stop offset="0.72" stop-color="#FF321C" />
      <stop offset="1" stop-color="#FF6A3D" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A281E" />
      <stop offset="0.48" stop-color="#A23625" />
      <stop offset="0.7" stop-color="#FF321C" />
      <stop offset="1" stop-color="#FF321C" stop-opacity="0" />
    </linearGradient>
    <mask id="wordMask">
      <rect width="1200" height="250" fill="black" />
      <text x="600" y="161" text-anchor="middle" fill="white" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="146" font-weight="900" letter-spacing="9">PRALAV</text>
    </mask>
  </defs>

  <rect x="34" y="36" width="1132" height="144" fill="url(#idlePixels)" opacity="0.48" />
  <rect x="34" y="36" width="1132" height="144" fill="url(#livePixels)" mask="url(#wordMask)" />
  <rect x="34" y="36" width="1132" height="144" fill="url(#heat)" mask="url(#wordMask)" opacity="0.46" />

  <rect x="34" y="207" width="1132" height="7" rx="3.5" fill="#26130F" />
  <rect x="34" y="207" width="760" height="7" rx="3.5" fill="url(#rail)" />
  <circle cx="795" cy="210.5" r="8" fill="#FF321C">
    <animate attributeName="r" values="7;10;7" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
