<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Pralav editorial profile banner</title>
  <desc id="desc">An editorial banner introducing Pralav Singh and his work across software, systems, and stories.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171512" />
      <stop offset="0.64" stop-color="#171512" />
      <stop offset="0.64" stop-color="#FF321C" />
      <stop offset="1" stop-color="#FF321C" />
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#EEE7D6" />

  <g fill="none" stroke="#FF321C" stroke-width="2">
    <path d="M18 31V17H32" />
    <path d="M1182 31V17H1168" />
    <path d="M18 229V243H32" />
    <path d="M1182 229V243H1168" />
  </g>

  <text x="50" y="47" fill="#625D55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="5">THE INTERNET — EST. 2024 — EDITION №01 — SOFTWARE · SYSTEMS · STORIES</text>
  <circle cx="1100" cy="43" r="4" fill="#FF321C">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="1113" y="47" fill="#FF321C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">LIVE</text>
  <path d="M50 60H1150" stroke="#A49D8D" stroke-width="1" />

  <text x="48" y="174" fill="#171512" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="-8">pralav</text>
  <rect x="432" y="148" width="28" height="28" fill="#FF321C" />

  <rect x="50" y="191" width="1100" height="3" fill="url(#signal)" />
  <text x="50" y="224" fill="#625D55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">PRALAV SINGH</text>
  <text x="1150" y="224" text-anchor="end" fill="#625D55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">GITHUB.COM/PRALAV-25</text>
</svg>
